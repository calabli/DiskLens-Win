[package]
name = "disklens"
description = "DiskLens: Windows 磁盘空间分析与管理"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# `_lib` 后缀用来避免 Windows 上 lib 与 bin 同名冲突，见 https://github.com/rust-lang/cargo/issues/8519
name = "disklens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
dl-analyze.workspace = true
dl-clean.workspace = true
dl-tree.workspace = true
dl-walk.workspace = true
dl-ntfs.workspace = true
dl-snapshot.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[lints]
workspace = true
